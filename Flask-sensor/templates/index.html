<!doctype html>
    <title> Hello</title>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
    </head>

    <body>
        <h1> ok</h1>
        <p>Door: {{ sensor.doorState }}</p>
        <p>Motion: {{ sensor.motion }}</p>


        <!-- Button trigger modal -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
        View Latest Logs
        </button>

        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id ="sensorContainer">
                
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
            </div>
        </div>
        </div>
        </div>
    </body>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
    <script>
        async function updatedData() {
    console.log("updatedData ran");

    const response = await fetch('/api/sensor');
    console.log("API response:", response);

    const data = await response.json();
    console.log("Data:", data);

    const container = document.getElementById("sensorContainer");
    console.log("Container:", container);

    const div = document.createElement("div");
    div.textContent = "Door: " + data.doorState;

    container.appendChild(div);

    console.log("Added div");
}
    updatedData();
    </script>
    
</html>
